<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            border: none;
        }

        .gsap-btn {
            background: white;
            cursor: pointer;
            padding: 0 20px;
        }

        /* THIS is the viewport */
        .text-mask {
            height: 20px;
            overflow: hidden;
            display: block;
            position: relative;
        }

        /* stack texts */
        .text-wrapper {
            display: flex;
            flex-direction: column;
        }

        /* MUST match mask height */
        .text {
            height: 20px;
            line-height: 20px;
        }

        /* each line is a mask for its chars */
        .text {
            position: relative;
        }
    </style>
</head>

<body>
    <button class="gsap-btn">
        <span class="text-mask">
            <span class="text-wrapper">
                <span class="text">Read More</span>
                <span class="text">Read More</span>
            </span>
        </span>
    </button>

    <button class="gsap-btn">
        <span class="text-mask">
            <span class="text-wrapper">
                <span class="text">Contact</span>
                <span class="text">Contact</span>
            </span>
        </span>
    </button>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>
    <script>
        // Make sure SplitText is loaded from GSAP CDN in your Pen settings
        gsap.registerPlugin(SplitText);

        gsap.utils.toArray(".gsap-btn").forEach((btn) => {
            const texts = btn.querySelectorAll(".text"); // 2 lines per button
            const topText = texts[0];
            const bottomText = texts[1];

            // Split both lines into chars
            const topSplit = new SplitText(topText, { type: "chars" });
            const bottomSplit = new SplitText(bottomText, { type: "chars" });

            const tl = gsap.timeline({
                paused: true,
                defaults: {
                    duration: 0.4,
                    ease: "power3.out"
                }
            });

            // For each character index, animate the top and bottom char together
            topSplit.chars.forEach((char, i) => {
                const pair = [char, bottomSplit.chars[i]]; // upper + lower same letter

                tl.to(
                    pair,
                    {
                        yPercent: -100 // jump up inside each line's mask
                    },
                    i * 0.05 // stagger like a slot machine
                );
            });

            btn.addEventListener("mouseenter", () => tl.play());
            btn.addEventListener("mouseleave", () => tl.reverse());
        });

    </script>
</body>

</html>
